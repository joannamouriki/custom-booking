<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage booking</title><style>body{margin:0;background:#faf9f6;color:#191c22;font:16px Arial,sans-serif}.wrap{max-width:680px;margin:60px auto;padding:0 24px}h1{font:42px Georgia,serif;margin:0 0 12px}.card{border:1px solid #191c22;background:#fff;padding:28px;margin-top:28px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.slot,button{padding:12px;border:1px solid #191c22;background:#fff;font:inherit;cursor:pointer}.slot.selected{background:#e8edf2}.primary{background:#1b2a3d;color:#fff;width:100%}.danger{color:#9e2530;border-color:#9e2530;margin-top:18px}.hidden{display:none}.error{color:#9e2530;font-weight:bold}.success{color:#185c3c;font-weight:bold}</style></head><body><main class="wrap"><p>INTERVIEW BOOKING</p><h1>Manage your booking</h1><p id="status">Loading your booking…</p><section id="content" class="card hidden"><p id="current"></p><h2>Reschedule</h2><div id="slots" class="slots"></div><button id="reschedule" class="primary" disabled>Confirm new time</button><button id="cancel" class="danger">Cancel booking</button></section></main><script src="manage.js"></script></body></html>
